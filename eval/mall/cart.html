<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장바구니 - 온글몰</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="mall.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <h1>장바구니</h1>
    <div id="cart"></div>
  </main>
  <div id="site-footer"></div>

  <script type="module">
    import { FREE_SHIPPING_MIN, productById } from './data.js';
    import { buyNow, cart, optionText, totals, unitPrice, won } from './store.js';
    import { $, h, renderHeader, renderFooter } from './common.js';

    const MINUS = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2"/></svg>';
    const PLUS = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg>';
    const CLOSE = '<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2"/></svg>';

    renderFooter();
    render();

    // 다시 그려도 키보드 초점이 같은 자리에 남게 한다 (data-f: 초점 자리 이름)
    function render() {
      const focused = document.activeElement?.dataset?.f;
      draw();
      const target = focused && (document.querySelector(`[data-f="${focused}"]`) ?? document.querySelector('#select-all') ?? document.querySelector('h1'));
      if (target) {
        if (target.matches('h1')) target.tabIndex = -1;
        target.focus();
      }
    }

    function draw() {
      renderHeader();
      const lines = cart.lines();
      const box = $('#cart');
      if (!lines.length) {
        box.replaceChildren(h('p', { class: 'empty' }, '장바구니가 비어 있습니다. ', h('a', { href: 'index.html' }, '상품 보러 가기')));
        return;
      }
      const save = (next) => { cart.save(next); render(); };
      const change = (key, patch) => save(cart.lines().map((l) => (l.key === key ? { ...l, ...patch } : l)));
      const selected = lines.filter((l) => l.selected);
      const sum = totals(selected);

      box.replaceChildren(
        h('div', { class: 'cart-tools' },
          h('label', {}, h('input', { type: 'checkbox', id: 'select-all', 'data-f': 'all', checked: selected.length === lines.length,
            onchange: (e) => save(lines.map((l) => ({ ...l, selected: e.target.checked }))) }), ` 전체 선택 (${selected.length}/${lines.length})`),
          h('button', { type: 'button', class: 'btn', 'data-f': 'remove-selected', onclick: () => save(lines.filter((l) => !l.selected)), disabled: !selected.length }, '선택 상품 삭제')
        ),
        h('ul', { class: 'cart-list', 'aria-label': '담은 상품' },
          lines.map((line) => {
            const p = productById(line.productId);
            if (!p) return null;
            const id = `qty-${line.key.replace(/\W/g, '')}`;
            const f = (name) => `${name}-${line.key}`;
            return h('li', { class: 'cart-item' },
              h('input', { type: 'checkbox', 'data-f': f('check'), 'aria-label': `${p.name} 선택`, checked: line.selected, onchange: (e) => change(line.key, { selected: e.target.checked }) }),
              h('img', { src: p.images[0].src, alt: '' }),
              h('div', {}, h('a', { href: `product.html?id=${p.id}` }, p.name), h('p', { class: 'opt' }, optionText(line.choice))),
              h('div', {},
                h('label', { for: id, class: 'sr-only' }, `${p.name} 수량`),
                h('div', { class: 'qty' },
                  // [접근성 문제] 수량 줄이기·늘리기 버튼에 이름이 없다
                  h('button', { type: 'button', 'data-f': f('minus'), onclick: () => change(line.key, { quantity: Math.max(1, line.quantity - 1) }), html: MINUS }),
                  h('input', { id, 'data-f': f('qty'), type: 'number', min: '1', max: '99', value: String(line.quantity),
                    onchange: (e) => change(line.key, { quantity: Math.min(99, Math.max(1, Number(e.target.value) || 1)) }) }),
                  h('button', { type: 'button', 'data-f': f('plus'), onclick: () => change(line.key, { quantity: Math.min(99, line.quantity + 1) }), html: PLUS })
                )
              ),
              h('strong', {}, won(unitPrice(p, line.choice) * line.quantity)),
              // [접근성 문제] 삭제 버튼에 이름이 없다 (X 그림만 있음)
              h('button', { type: 'button', class: 'remove', onclick: () => save(cart.lines().filter((l) => l.key !== line.key)), html: CLOSE })
            );
          })
        ),
        h('section', { class: 'summary', 'aria-labelledby': 'sum-title' },
          h('h2', { id: 'sum-title' }, '결제 예정 금액'),
          h('dl', {},
            h('dt', {}, `상품 금액 (${sum.count}개)`), h('dd', {}, won(sum.goods + sum.discount)),
            h('dt', {}, '할인 금액'), h('dd', {}, sum.discount ? `-${won(sum.discount)}` : '0원'),
            h('dt', {}, '배송비'), h('dd', {}, won(sum.shipping)),
            h('dt', { class: 'grand' }, '결제 예정 금액'), h('dd', { class: 'grand' }, won(sum.total))
          ),
          sum.shipping ? h('p', { class: 'hint' }, `${won(FREE_SHIPPING_MIN - sum.goods)} 더 담으면 배송비가 무료입니다.`) : null
        ),
        h('div', { class: 'actions' },
          h('a', { class: 'btn wide', href: 'index.html' }, '쇼핑 계속하기'),
          h('button', { type: 'button', class: 'btn primary wide', id: 'order', disabled: !selected.length, onclick: () => {
            buyNow.clear();
            location.href = 'checkout.html';
          } }, selected.length ? `선택 상품 주문하기 (${won(sum.total)})` : '주문할 상품을 고르세요')
        )
      );
    }
  </script>
</body>
</html>
