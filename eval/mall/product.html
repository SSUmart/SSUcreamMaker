<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 - 온글몰</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="mall.css">
</head>
<body>
  <div id="site-header"></div>
  <nav class="breadcrumb" aria-label="현재 위치"><ol id="crumbs"></ol></nav>
  <main id="main" tabindex="-1"></main>
  <div id="site-footer"></div>

  <script type="module">
    import { CATEGORIES, FREE_SHIPPING_MIN, REVIEWS, SHIPPING_FEE, productById } from './data.js';
    import { buyNow, cart, missingOptions, unitPrice, won } from './store.js';
    import { $, h, renderHeader, renderFooter, toast } from './common.js';

    const MINUS = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2"/></svg>';
    const PLUS = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg>';

    const product = productById(new URLSearchParams(location.search).get('id'));
    renderHeader({ category: product?.category });
    renderFooter();
    const main = $('#main');

    if (!product) {
      main.append(h('h1', {}, '상품을 찾을 수 없습니다'), h('p', {}, h('a', { href: 'index.html' }, '상품 목록으로 가기')));
    } else {
      render();
    }

    function render() {
      document.title = `${product.name} - 온글몰`;
      const categoryName = CATEGORIES.find((c) => c.id === product.category)?.name;
      $('#crumbs').append(
        h('li', {}, h('a', { href: 'index.html' }, '홈')),
        h('li', {}, h('a', { href: `index.html?category=${product.category}` }, categoryName)),
        h('li', { 'aria-current': 'page' }, product.name)
      );

      const choice = {};
      let quantity = 1;

      // 사진: 큰 사진 + 작은 사진 버튼
      const mainImg = h('img', { class: 'gallery-main', src: product.images[0].src, alt: product.images[0].alt });
      const thumbs = product.images.length > 1 &&
        h('ul', { class: 'thumbs', 'aria-label': '상품 사진' },
          product.images.map((img, i) =>
            h('li', {}, h('button', {
              type: 'button', 'aria-pressed': i === 0 ? 'true' : 'false',
              onclick: (e) => {
                mainImg.src = img.src;
                mainImg.alt = img.alt;
                thumbs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
              }
            }, h('img', { src: img.src, alt: `${i + 1}번 사진 크게 보기: ${img.alt}` })))
          )
        );

      // 옵션
      const optionFields = product.options.map((option, i) => {
        const id = `opt-${i}`;
        if (option.type === 'buttons') {
          // [접근성 문제] 사이즈 버튼은 고른 것을 색과 테두리로만 보여 준다 (눌림 상태를 알리지 않음)
          const group = h('div', { class: 'size-buttons' },
            option.values.map((v) => h('button', {
              type: 'button', disabled: v.soldOut,
              onclick: (e) => {
                choice[option.name] = v.name;
                group.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === e.currentTarget));
                update();
              }
            }, v.soldOut ? `${v.name} 품절` : v.name))
          );
          return h('div', { class: 'field' }, h('p', { class: 'field-title' }, h('strong', {}, option.name)), group);
        }
        const select = h('select', { id, onchange: (e) => { choice[option.name] = e.target.value || undefined; update(); } },
          h('option', { value: '' }, `${option.name}을(를) 고르세요`),
          option.values.map((v) => h('option', { value: v.name, disabled: v.soldOut },
            `${v.name}${v.extra ? ` (+${won(v.extra)})` : ''}${v.soldOut ? ' (품절)' : ''}`))
        );
        return h('div', { class: 'field' }, h('label', { for: id }, option.name), select);
      });

      const qtyInput = h('input', { id: 'qty', type: 'number', min: '1', max: '99', value: '1', inputmode: 'numeric',
        onchange: (e) => { quantity = Math.min(99, Math.max(1, Number(e.target.value) || 1)); e.target.value = quantity; update(); } });
      const step = (d) => () => { quantity = Math.min(99, Math.max(1, quantity + d)); qtyInput.value = quantity; update(); };
      const totalEl = h('p', { class: 'line-total', role: 'status' });
      const errorEl = h('p', { class: 'error', role: 'alert', id: 'option-error' });

      function update() {
        totalEl.textContent = `총 상품 금액 ${won(unitPrice(product, choice) * quantity)} (수량 ${quantity}개)`;
        if (!missingOptions(product, choice).length) errorEl.textContent = '';
      }

      function checkOptions() {
        const missing = missingOptions(product, choice);
        if (missing.length) {
          errorEl.textContent = `${missing.join(', ')}을(를) 골라 주세요.`;
          return false;
        }
        return true;
      }

      const item = () => ({ productId: product.id, choice: { ...choice }, quantity });

      const info = h('div', { class: 'info' },
        h('p', { class: 'brand' }, product.brand),
        h('h1', {}, product.name),
        h('p', {}, `별점 ${product.rating}점 (리뷰 ${product.reviewCount}개)`),
        h('p', { class: 'price-box' },
          product.salePrice && h('span', { class: 'rate' }, `${Math.round((1 - product.salePrice / product.price) * 100)}%`),
          product.salePrice && h('span', { class: 'list-price' }, h('span', { class: 'sr-only' }, '정가 '), won(product.price)),
          h('span', {}, product.salePrice ? h('span', { class: 'sr-only' }, '할인가 ') : null, won(product.salePrice ?? product.price))),
        h('p', {}, product.summary),
        h('p', { class: 'hint' }, `배송비 ${won(SHIPPING_FEE)} (${won(FREE_SHIPPING_MIN)} 이상 무료). 오후 2시 이전 주문은 당일 출고.`),
        h('h2', {}, '옵션 선택'),
        optionFields,
        h('div', { class: 'field' },
          h('label', { for: 'qty' }, '수량'),
          h('div', { class: 'qty' },
            // [접근성 문제] 수량 줄이기·늘리기 버튼에 이름이 없다 (- + 그림만 있음)
            h('button', { type: 'button', class: 'qty-minus', onclick: step(-1), html: MINUS }),
            qtyInput,
            h('button', { type: 'button', class: 'qty-plus', onclick: step(1), html: PLUS })
          )
        ),
        totalEl,
        errorEl,
        h('div', { class: 'actions' },
          h('button', { type: 'button', class: 'btn wide', id: 'add-cart', onclick: () => {
            if (!checkOptions()) return;
            cart.add(item());
            renderHeader({ category: product.category });
            toast('장바구니에 담았습니다.', { href: 'cart.html', text: '장바구니 보기' });
          } }, '장바구니 담기'),
          h('button', { type: 'button', class: 'btn primary wide', id: 'buy-now', onclick: () => {
            if (!checkOptions()) return;
            buyNow.set({ ...item(), key: 'buy-now', selected: true });
            location.href = 'checkout.html?mode=now';
          } }, '바로 구매')
        )
      );

      main.append(h('div', { class: 'product' }, h('div', {}, mainImg, thumbs), info), tabs());
      update();
    }

    // 상세정보·리뷰·배송 탭 (WAI-ARIA 탭: 좌우 화살표·Home·End로 이동)
    function tabs() {
      const reviews = REVIEWS[product.id] ?? [];
      const panels = [
        ['상세정보', detail()],
        [`리뷰 (${reviews.length})`, h('ul', { class: 'reviews' }, reviews.map((r) => h('li', {}, h('p', {}, h('strong', {}, `별점 ${r.rating}점`), ` · ${r.author}`), h('p', {}, r.text))))],
        ['배송·교환·반품', shippingTable()]
      ];
      const list = h('div', { role: 'tablist', 'aria-label': '상품 정보' });
      const wrap = h('section', { class: 'tabs', 'aria-label': '상품 정보' }, list);
      const buttons = panels.map(([title, body], i) => {
        const tab = h('button', { type: 'button', role: 'tab', id: `tab-${i}`, 'aria-controls': `panel-${i}`, 'aria-selected': String(i === 0), tabindex: i === 0 ? '0' : '-1' }, title);
        // 패널에 누를 것이 없어도(상세 이미지 등) Tab으로 탭 다음에 내용으로 들어갈 수 있게 tabindex=0 (W3C 탭 패턴)
        wrap.append(h('div', { role: 'tabpanel', id: `panel-${i}`, 'aria-labelledby': `tab-${i}`, tabindex: '0', hidden: i !== 0 }, h('h2', {}, title.replace(/ \(\d+\)$/, '')), body));
        return tab;
      });
      const select = (i) => {
        buttons.forEach((b, j) => {
          b.setAttribute('aria-selected', String(i === j));
          b.tabIndex = i === j ? 0 : -1;
          wrap.querySelector(`#panel-${j}`).hidden = i !== j;
        });
        buttons[i].focus();
      };
      buttons.forEach((b, i) => {
        b.addEventListener('click', () => select(i));
        b.addEventListener('keydown', (e) => {
          const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: buttons.length - 1 }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          select((next + buttons.length) % buttons.length);
        });
      });
      list.append(...buttons);
      return wrap;
    }

    function detail() {
      // [접근성 문제] 상세 정보가 글자 없이 이미지로만 있고, 대체 텍스트도 없다 (온글의 상세 이미지 읽기 대상)
      return h('div', { class: 'detail-images' }, product.detailImages.map((src) => h('img', { src, width: '860' })));
    }

    function shippingTable() {
      const rows = [
        ['배송비', `${won(SHIPPING_FEE)}, ${won(FREE_SHIPPING_MIN)} 이상 무료`],
        ['배송 기간', '오후 2시 이전 주문은 당일 출고, 보통 1~2일 뒤 도착'],
        ['교환·반품', '받은 날부터 7일 안에 신청. 단순 변심은 왕복 배송비 6,000원'],
        ['교환·반품 불가', '사용했거나 포장을 훼손한 경우']
      ];
      return h('table', {}, h('caption', { class: 'sr-only' }, '배송·교환·반품 안내'),
        h('tbody', {}, rows.map(([k, v]) => h('tr', {}, h('th', { scope: 'row' }, k), h('td', {}, v)))));
    }
  </script>
</body>
</html>
