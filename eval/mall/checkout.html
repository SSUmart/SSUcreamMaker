<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문/결제 - 온글몰</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="mall.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <h1>주문/결제</h1>
    <div id="checkout"></div>
  </main>
  <div id="site-footer"></div>

  <!-- 우편번호 찾기: 접근성을 지킨 대화상자 (제목, 초점 이동, Esc로 닫기) -->
  <div class="dim" id="zip-dim" hidden>
    <div class="layer" role="dialog" aria-modal="true" aria-labelledby="zip-title">
      <h2 id="zip-title">우편번호 찾기</h2>
      <p class="hint">가상 주소 검색입니다. 도로명이나 건물 이름을 입력하세요. (예: 상도로, 세종대로)</p>
      <form id="zip-form" class="row">
        <label for="zip-q" class="sr-only">주소 검색어</label>
        <input id="zip-q" type="search" placeholder="도로명, 건물 이름">
        <button type="submit" class="btn">검색</button>
      </form>
      <p id="zip-count" role="status" class="hint"></p>
      <ul class="zip-results" id="zip-results"></ul>
      <button type="button" class="btn" id="zip-close">닫기</button>
    </div>
  </div>

  <script type="module">
    import { ADDRESS_BOOK, BANKS, CARD_COMPANIES, EASY_PAYS, SAVED_ADDRESS, productById } from './data.js';
    import { buyNow, cart, lastOrder, optionText, orderNumber, totals, unitPrice, validateOrder, won } from './store.js';
    import { $, h, renderHeader, renderFooter } from './common.js';

    renderHeader();
    renderFooter();

    const fromBuyNow = new URLSearchParams(location.search).get('mode') === 'now' && buyNow.get();
    const lines = fromBuyNow ? [buyNow.get()] : cart.lines().filter((l) => l.selected);
    const box = $('#checkout');
    if (!lines.length) {
      box.append(h('p', { class: 'empty' }, '주문할 상품이 없습니다. ', h('a', { href: 'cart.html' }, '장바구니로 가기')));
    } else {
      render();
    }

    function radio(name, value, label, checked, onchange) {
      const id = `${name}-${value}`;
      return h('label', { for: id }, h('input', { type: 'radio', id, name, value, checked, onchange }), label);
    }

    function render() {
      const sum = totals(lines);
      const state = { easyPay: '' };

      const errorBox = h('div', { class: 'error-list', id: 'errors', role: 'alert', tabindex: '-1' });

      // 주문 상품
      const items = h('section', { 'aria-labelledby': 'items-title' },
        h('h2', { id: 'items-title' }, `주문 상품 ${lines.length}건`),
        h('ul', { class: 'order-items' }, lines.map((l) => {
          const p = productById(l.productId);
          return h('li', {}, h('span', {}, `${p.name} (${optionText(l.choice)}) ${l.quantity}개`), h('strong', {}, won(unitPrice(p, l.choice) * l.quantity)));
        }))
      );

      // 주문하는 분
      const orderer = h('section', { 'aria-labelledby': 'orderer-title' },
        h('h2', { id: 'orderer-title' }, '주문하는 분'),
        h('div', { class: 'field' }, h('label', { for: 'orderer-name' }, '이름'), h('input', { type: 'text', id: 'orderer-name', autocomplete: 'name' })),
        // [접근성 문제] 휴대폰 번호 칸에 라벨이 없다 (칸 안의 흐린 안내 글자만 있음)
        h('div', { class: 'field' }, h('input', { type: 'tel', id: 'orderer-phone', placeholder: '휴대폰 번호 (010-1234-5678)', autocomplete: 'tel' })),
        h('div', { class: 'field' }, h('label', { for: 'orderer-email' }, '이메일 (선택)'), h('input', { type: 'text', id: 'orderer-email', autocomplete: 'email' }))
      );

      // 배송지
      const newAddress = h('div', { id: 'new-address', hidden: true },
        h('div', { class: 'field' }, h('label', { for: 'ship-name' }, '받는 분'), h('input', { type: 'text', id: 'ship-name' })),
        h('div', { class: 'field' }, h('label', { for: 'ship-phone' }, '받는 분 휴대폰 번호'), h('input', { type: 'tel', id: 'ship-phone', placeholder: '010-1234-5678' })),
        h('div', { class: 'field' },
          h('label', { for: 'ship-zipcode' }, '우편번호'),
          h('div', { class: 'row' },
            h('input', { type: 'text', id: 'ship-zipcode', readonly: true }),
            h('button', { type: 'button', class: 'btn', id: 'zip-open', onclick: openZip }, '우편번호 찾기'))),
        h('div', { class: 'field' }, h('label', { for: 'ship-address' }, '주소'), h('input', { type: 'text', id: 'ship-address', readonly: true })),
        h('div', { class: 'field' }, h('label', { for: 'ship-detail' }, '상세 주소'), h('input', { type: 'text', id: 'ship-detail' }))
      );
      const savedCard = h('div', { class: 'address-card', id: 'saved-address' },
        h('p', {}, h('strong', {}, `${SAVED_ADDRESS.name} (기본 배송지)`)),
        h('p', {}, SAVED_ADDRESS.phone),
        h('p', {}, `[${SAVED_ADDRESS.zipcode}] ${SAVED_ADDRESS.address} ${SAVED_ADDRESS.detail}`));
      const showAddress = (type) => {
        newAddress.hidden = type !== 'new';
        savedCard.hidden = type === 'new';
      };
      const memoInput = h('input', { type: 'text', id: 'ship-memo-text', hidden: true, 'aria-label': '배송 요청사항 직접 입력' });
      const shipping = h('section', { 'aria-labelledby': 'ship-title' },
        h('h2', { id: 'ship-title' }, '배송지'),
        h('fieldset', {}, h('legend', { class: 'sr-only' }, '배송지 선택'),
          h('div', { class: 'radio-line' },
            radio('address', 'saved', '기본 배송지', true, () => showAddress('saved')),
            radio('address', 'new', '새로 입력', false, () => showAddress('new')))),
        savedCard,
        newAddress,
        h('div', { class: 'field' }, h('label', { for: 'ship-memo' }, '배송 요청사항'),
          h('select', { id: 'ship-memo', onchange: (e) => (memoInput.hidden = e.target.value !== '직접 입력') },
            ['요청사항 없음', '문 앞에 놓아 주세요', '경비실에 맡겨 주세요', '배송 전에 연락 주세요', '직접 입력'].map((t) => h('option', {}, t))),
          memoInput)
      );

      // 결제수단
      const cardFields = h('div', { id: 'card-fields' },
        h('div', { class: 'field' }, h('label', { for: 'card-company' }, '카드사'),
          h('select', { id: 'card-company' }, h('option', { value: '' }, '카드사를 고르세요'), CARD_COMPANIES.map((c) => h('option', {}, c)))),
        h('div', { class: 'field' }, h('label', { for: 'card-months' }, '할부'),
          h('select', { id: 'card-months' }, ['일시불', '2개월', '3개월', '6개월'].map((m) => h('option', {}, m)))));
      const bankFields = h('div', { id: 'bank-fields', hidden: true },
        h('div', { class: 'field' }, h('label', { for: 'bank-name' }, '입금 은행'),
          h('select', { id: 'bank-name' }, h('option', { value: '' }, '은행을 고르세요'), BANKS.map((b) => h('option', {}, b)))),
        h('div', { class: 'field' }, h('label', { for: 'depositor' }, '입금자 이름'), h('input', { type: 'text', id: 'depositor' })),
        h('p', { class: 'hint' }, '주문 후 3일 안에 입금하지 않으면 주문이 취소됩니다. (가상 안내)'));
      const phoneFields = h('p', { id: 'phone-fields', class: 'hint', hidden: true }, '결제하기를 누르면 휴대폰 인증 창이 열립니다. (가상)');
      // [접근성 문제] 간편결제 버튼에 글자 없이 로고 그림만 있고, 그림에 대체 텍스트가 없다. 고른 상태도 테두리 색으로만 보인다
      const easyFields = h('div', { id: 'easy-fields', hidden: true },
        h('div', { class: 'easy-pays' }, EASY_PAYS.map((pay, i) => h('button', {
          type: 'button', id: i === 0 ? 'easy-first' : null, 'data-pay': pay.id,
          onclick: (e) => {
            state.easyPay = pay.name;
            easyFields.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === e.currentTarget));
          }
        }, h('img', { src: logo(pay) })))));
      const payPanels = { card: cardFields, bank: bankFields, phone: phoneFields, easy: easyFields };
      const showPay = (type) => Object.entries(payPanels).forEach(([k, el]) => (el.hidden = k !== type));
      const payment = h('section', { 'aria-labelledby': 'pay-title' },
        h('h2', { id: 'pay-title' }, '결제수단'),
        h('fieldset', {}, h('legend', { class: 'sr-only' }, '결제수단 선택'),
          h('div', { class: 'radio-line' },
            radio('pay', 'card', '신용카드', true, () => showPay('card')),
            radio('pay', 'bank', '무통장입금', false, () => showPay('bank')),
            radio('pay', 'phone', '휴대폰 결제', false, () => showPay('phone')),
            radio('pay', 'easy', '간편결제', false, () => showPay('easy')))),
        cardFields, bankFields, phoneFields, easyFields
      );

      // 결제 금액과 동의
      const aside = h('aside', { class: 'sticky', 'aria-labelledby': 'total-title' },
        h('section', { class: 'summary' },
          h('h2', { id: 'total-title' }, '결제 금액'),
          h('dl', {},
            h('dt', {}, '상품 금액'), h('dd', {}, won(sum.goods + sum.discount)),
            h('dt', {}, '할인 금액'), h('dd', {}, sum.discount ? `-${won(sum.discount)}` : '0원'),
            h('dt', {}, '배송비'), h('dd', {}, won(sum.shipping)),
            h('dt', { class: 'grand' }, '최종 결제 금액'), h('dd', { class: 'grand' }, won(sum.total))),
          h('p', {}, h('label', {}, h('input', { type: 'checkbox', id: 'agree' }), ' 주문 내용을 확인했으며 결제 진행에 동의합니다 (필수)')),
          h('button', { type: 'button', class: 'btn primary', id: 'pay', style: 'width:100%', onclick: submit }, `${won(sum.total)} 결제하기`))
      );

      box.append(errorBox, h('div', { class: 'checkout' }, h('div', {}, items, orderer, shipping, payment), aside));

      function readForm() {
        const v = (id) => $(`#${id}`)?.value ?? '';
        const addressType = document.querySelector('input[name="address"]:checked').value;
        return {
          ordererName: v('orderer-name'), ordererPhone: v('orderer-phone'), addressType,
          shipName: v('ship-name'), shipPhone: v('ship-phone'), zipcode: v('ship-zipcode'), address: v('ship-address'), detail: v('ship-detail'),
          memo: v('ship-memo') === '직접 입력' ? v('ship-memo-text') : v('ship-memo'),
          payment: document.querySelector('input[name="pay"]:checked')?.value,
          cardCompany: v('card-company'), cardMonths: v('card-months'), bank: v('bank-name'), depositor: v('depositor'), easyPay: state.easyPay,
          agree: $('#agree').checked
        };
      }

      function submit() {
        const form = readForm();
        const errors = validateOrder(form);
        document.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
        if (errors.length) {
          errorBox.replaceChildren(h('strong', {}, `입력을 확인해 주세요. ${errors.length}개 항목이 비었거나 틀렸습니다.`),
            h('ul', {}, errors.map((e) => h('li', {}, h('a', { href: `#${e.field}`, onclick: (ev) => { ev.preventDefault(); $(`#${e.field}`)?.focus(); } }, e.message)))));
          errors.forEach((e) => $(`#${e.field}`)?.setAttribute('aria-invalid', 'true'));
          errorBox.focus();
          return;
        }
        errorBox.replaceChildren();
        openPg(form, sum);
      }
    }

    // 간편결제 로고 (글자가 들어간 그림)
    function logo(pay) {
      const dark = pay.id === 'kakaopay' ? '#191919' : '#fff';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 44"><rect width="110" height="44" rx="6" fill="${pay.color}"/><text x="55" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="${dark}" font-family="sans-serif">${pay.name}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    // ----- 우편번호 찾기 (접근성을 지킨 대화상자) -----
    const zipDim = $('#zip-dim');
    function openZip() {
      zipDim.hidden = false;
      $('#zip-q').focus();
    }
    function closeZip() {
      zipDim.hidden = true;
      $('#zip-open')?.focus();
    }
    $('#zip-close').addEventListener('click', closeZip);
    zipDim.addEventListener('keydown', (e) => e.key === 'Escape' && closeZip());
    $('#zip-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = $('#zip-q').value.trim();
      const found = ADDRESS_BOOK.filter((a) => q && a.address.includes(q));
      $('#zip-count').textContent = q ? `검색 결과 ${found.length}개` : '검색어를 입력하세요.';
      $('#zip-results').replaceChildren(...found.map((a) => h('li', {}, h('button', { type: 'button', onclick: () => {
        $('#ship-zipcode').value = a.zipcode;
        $('#ship-address').value = a.address;
        zipDim.hidden = true;
        $('#ship-detail').focus();
      } }, `[${a.zipcode}] ${a.address}`))));
    });

    // ----- 가상 결제창 -----
    // [접근성 문제] 결제창이 대화상자로 표시되지 않고(role 없음) 열려도 초점이 옮겨지지 않는다. 닫기(X) 버튼에도 이름이 없다
    function openPg(form, sum) {
      document.querySelector('.pg')?.remove();
      const method = { card: `${form.cardCompany} ${form.cardMonths}`, bank: `무통장입금 (${form.bank})`, phone: '휴대폰 결제', easy: form.easyPay }[form.payment];
      const body = h('div', { class: 'pg-body' },
        h('p', {}, '결제수단: ', h('strong', {}, method)),
        h('p', { class: 'pg-amount' }, won(sum.total)),
        h('p', { class: 'hint' }, '이 결제창은 가상입니다. 승인을 눌러도 실제로 결제되지 않습니다.'),
        h('button', { type: 'button', class: 'btn primary', id: 'pg-approve', style: 'width:100%', onclick: approve }, '결제 승인'));
      const pg = h('div', { class: 'dim pg' },
        h('div', { class: 'layer' },
          h('div', { class: 'pg-head' }, '온글페이 가상 결제'),
          h('button', { type: 'button', class: 'close', onclick: () => pg.remove(), html: '<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2"/></svg>' }),
          body));
      document.body.append(pg);

      function approve() {
        body.replaceChildren(h('p', {}, h('span', { class: 'spinner' }), '결제를 진행하고 있습니다. 잠시만 기다려 주세요.'));
        setTimeout(() => {
          const shipTo = form.addressType === 'new'
            ? { name: form.shipName, phone: form.shipPhone, zipcode: form.zipcode, address: `${form.address} ${form.detail}` }
            : { ...SAVED_ADDRESS, address: `${SAVED_ADDRESS.address} ${SAVED_ADDRESS.detail}` };
          lastOrder.set({
            number: orderNumber(),
            orderedAt: new Date().toISOString(),
            lines: lines.map((l) => {
              const p = productById(l.productId);
              return { name: p.name, option: optionText(l.choice), quantity: l.quantity, amount: unitPrice(p, l.choice) * l.quantity };
            }),
            totals: sum, method, memo: form.memo, shipTo, orderer: form.ordererName
          });
          if (fromBuyNow) buyNow.clear();
          else cart.save(cart.lines().filter((l) => !l.selected));
          location.replace('complete.html');
        }, 1200);
      }
    }
  </script>
</body>
</html>
